trial, techno-economic and socio-institutional society","C":"International trade policy","D":"Military strategy"},"answer":"B","explanation":""},{"id":73,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"The Policy Philosophy checklist includes questions about all of the following EXCEPT","options":{"A":"Workforce demographics and education factors","B":"Venture capital availability","C":"Physical infrastructure quality","D":"Personal religious beliefs of policymakers"},"answer":"D","explanation":""},{"id":74,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy Objectives are described as","options":{"A":"The specific methods to reach a goal","B":"The aims, goals a policy is designed to achieve","C":"A measurement tool","D":"A legal requirement only"},"answer":"B","explanation":""},{"id":75,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy Strategies are","options":{"A":"The end goals themselves","B":"The specific, \"smart\" ways used to achieve policy objectives","C":"Unrelated to policy objectives","D":"Always financial in nature"},"answer":"B","explanation":""},{"id":76,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy implementation is normally carried out by entrusting it to","options":{"A":"A single individual","B":"One or more organizations/institutions with defined procedures","C":"Foreign governments","D":"The judiciary alone"},"answer":"B","explanation":""},{"id":77,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy instruments used to facilitate implementation are typically","options":{"A":"Financial, infrastructural, administrative, legislative","B":"Only financial","C":"Only legislative","D":"Purely symbolic"},"answer":"A","explanation":""},{"id":78,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy maintenance refers to","options":{"A":"Ending a policy once adopted","B":"Keeping the policy/program going after adoption","C":"Writing the initial policy draft","D":"Judicial review of policy"},"answer":"B","explanation":""},{"id":79,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy monitoring refers to","options":{"A":"Formulating new policy","B":"The process of \"keeping an eye on\" how policy is doing","C":"Ending a failed policy","D":"Advertising a policy"},"answer":"B","explanation":""},{"id":80,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy analysis assesses an existing policy in terms of","options":{"A":"Popularity, cost, and color","B":"Appropriateness, effectiveness, adequacy","C":"Political affiliation","D":"International ranking only"},"answer":"B","explanation":""},{"id":81,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy evaluation is described as","options":{"A":"The first step in the policy process","B":"The last step in the policy process","C":"Unrelated to policy objectives","D":"Only done by external consultants"},"answer":"B","explanation":""},{"id":82,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"The three types of evaluation design mentioned are Before-and-After, After-Only, and","options":{"A":"Random Sampling","B":"Time-Series","C":"Cost-Benefit","D":"Peer Review"},"answer":"B","explanation":""},{"id":83,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"Policy review is necessary because","options":{"A":"No policy is developed for indefinite use","B":"Policies never need updating","C":"It is a one-time legal requirement","D":"It replaces policy evaluation"},"answer":"A","explanation":""},{"id":84,"section":"Design & Evaluation of STI Policy (Siyanbola)","question":"According to the concluding remarks, for maximum results, each state needs","options":{"A":"A shared federal ministry only","B":"A separate S&T ministry (as in Lagos, Oyo)","C":"No S&T ministry at all","D":"A private-sector-run S&T body"},"answer":"B","explanation":""},{"id":85,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Who delivered the paper 'Addressing the Centrality of STI Policy in the Economic Transformation Process'?","options":{"A":"President Goodluck Jonathan","B":"Prof. Willie O. Siyanbola","C":"Prof. M.O. Ilori","D":"Tan Sri Dr Omar Abdul Rahman"},"answer":"B","explanation":"Slide 1 names Willie O. Siyanbola, DG/CEO of NACETEM, as the presenter."},{"id":86,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"At which forum and location was the paper delivered?","options":{"A":"Nigeria/UNESCO STI reform meeting, Abuja","B":"3rd Technology Management Forum, NACETEM South-South Office, Bayelsa","C":"Vision 20:2020 Summit, Lagos","D":"National Economic Team meeting, Kebbi"},"answer":"B","explanation":"Slide 1 states it was delivered at the 3rd Technology Management Forum for Directors of S&T, NACETEM South-South Office, Bayelsa State, August 2012."},{"id":87,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to Thomas R. Dye (1992), public policy is defined as","options":{"A":"The struggle in government over who gets what","B":"Whatever governments choose to do or not to do","C":"Political decisions to implement programmes for societal goals","D":"The sum of all government activities"},"answer":"B","explanation":"Slide 17 attributes this definition to Dye (1992)."},{"id":88,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which scholar(s) defined public policy as 'the outcome of the struggle in government over who gets what'?","options":{"A":"Guy Peters (1999)","B":"Thomas R. Dye (1992)","C":"Clarke E. Cochran et al. (1999)","D":"Cochran and Malone (1995)"},"answer":"C","explanation":"Slide 17 credits this to Clarke E. Cochran et al., American Public Policy: An Introduction (1999)."},{"id":89,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to the presentation, why can't STI Policy be a stand-alone policy?","options":{"A":"Because it is too expensive to implement alone","B":"Because it must be an integral part of the National Economic Development Policy","C":"Because only the private sector can run it","D":"Because it is purely a scientific, not political, matter"},"answer":"B","explanation":"Slide 16 states STI Policy must be integrated into the National Economic Development Policy to be relevant."},{"id":90,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Vision 20:2020's four dimensions include all of the following EXCEPT","options":{"A":"Social Dimension","B":"Economic Dimension","C":"Religious Dimension","D":"Environmental Dimension"},"answer":"C","explanation":"Slide 6 lists Social, Economic, Institutional, and Environmental dimensions \u2014 not Religious."},{"id":91,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Under Vision 20:2020's Economic Dimension, manufacturing was targeted to contribute at least what share of GDP?","options":{"A":"10%","B":"15%","C":"25%","D":"50%"},"answer":"C","explanation":"Slide 6: 'a globally competitive manufacturing sector... contributes no less than 25% to GDP.'"},{"id":92,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Under Vision 20:2020's Social Dimension, life expectancy was targeted at no less than","options":{"A":"50 years","B":"60 years","C":"65 years","D":"70 years"},"answer":"D","explanation":"Slide 6 states a sustained life expectancy of not less than 70 years."},{"id":93,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Vision 20:2020 was to be implemented through how many medium-term National Development Plans (NDPs)?","options":{"A":"Two","B":"Three","C":"Four","D":"Five"},"answer":"B","explanation":"Slide 10: 5th NDP (2009\u20132012), 6th NDP (2013\u20132016), 7th NDP (2017\u20132020) \u2014 three plans."},{"id":94,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"What was Nigeria's GDP as reported for 2012 (IMF)?","options":{"A":"US$183 billion","B":"US$273 billion","C":"US$383 billion","D":"US$900 billion"},"answer":"B","explanation":"Slide 11 gives 2012 GDP as US$273 billion, ranked 36th worldwide."},{"id":95,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"What GDP target did the NV20:2020 vision set for Nigeria?","options":{"A":"US$383 billion","B":"US$500 billion","C":"US$900 billion","D":"US$1.2 trillion"},"answer":"C","explanation":"Slide 11: NV20:2020 expectation was GDP of US$900 billion, ranked 19th worldwide."},{"id":96,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to the 2017 IMF projection cited, Nigeria's economy was expected to grow by what factor relative to 2012?","options":{"A":"1.4 times","B":"2.0 times","C":"2.8 times","D":"3.3 times"},"answer":"A","explanation":"Slide 11 shows a 1.4x growth for the 2017 projection, versus the 3.3x needed to hit the NV20:2020 target."},{"id":97,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"What annual growth rate would Nigeria have needed to meet the full NV20:2020 GDP target?","options":{"A":"8%","B":"14%","C":"20%","D":"28.7%"},"answer":"D","explanation":"Slide 11 states a 28.7% growth demand per annum was required for the 3.3x target."},{"id":98,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Who is quoted as saying 'we are going to run our economy based on Science and Technology... without that we are just dreaming'?","options":{"A":"Willie O. Siyanbola","B":"Dr Goodluck Ebele Jonathan","C":"Omar Abdul Rahman","D":"J.G. Wissema"},"answer":"B","explanation":"Slide 13 attributes this quote to President Goodluck Ebele Jonathan, Birnin Kebbi, 2011."},{"id":99,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In the Wissema (2009) model (Figure 4.0), 'Know Why' refers to","options":{"A":"Technology","B":"Pure Sciences (body of knowledge)","C":"Entrepreneurship","D":"Innovation"},"answer":"B","explanation":"Slide 19: Pure Sciences represents 'Know Why' \u2014 the body of knowledge \u2014 while Technology represents 'Know How'."},{"id":100,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In the same model, Innovation is described as","options":{"A":"The initial discovery of scientific facts","B":"The successful application of something","C":"A purely academic exercise","D":"The same thing as invention"},"answer":"B","explanation":"Slide 19 defines Innovation as the 'Successful Application of Something', distinct from invention."},{"id":101,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which of these correctly orders the historical evolution of science policy thinking, from earliest to most recent?","options":{"A":"STI Policy \u2192 S&T Policy \u2192 Science Policy \u2192 Science for Development","B":"Science Policy \u2192 S&T Policy \u2192 Science for Development \u2192 STI Policy","C":"Science for Development \u2192 Science Policy \u2192 STI Policy \u2192 S&T Policy","D":"S&T Policy \u2192 Science Policy \u2192 STI Policy \u2192 Science for Development"},"answer":"B","explanation":"Slide 20 traces: Science Policy \u2192 S&T Policy \u2192 'science for technology for development' \u2192 today's STI Policy."},{"id":102,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The RD&C system referenced in the presentation stands for","options":{"A":"Research, Development and Commercialisation","B":"Research, Design and Construction","C":"Regulation, Development and Compliance","D":"Research, Diffusion and Coordination"},"answer":"A","explanation":"Slide 21 introduces the Research, Development and Commercialisation (RD&C) System."},{"id":103,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In the RD&C system, invention becomes innovation when it is","options":{"A":"Patented only","B":"Published in a journal","C":"Applied or commercialised","D":"Taught in universities"},"answer":"C","explanation":"Slide 21: 'Invention becomes innovation when applied or commercialised.'"},{"id":104,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In the STI Eco-System diagram (Figure 5.0), which of the following is NOT listed as a supporting element?","options":{"A":"Finance","B":"Human Capital","C":"Institutions","D":"Foreign Aid"},"answer":"D","explanation":"Slide 22 lists Finance, Human Capital, Institutions, Law and Regulations, and Process and Management \u2014 not Foreign Aid specifically."},{"id":105,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to the presentation, what gives a nation/state a competitive edge today?","options":{"A":"Its natural resource endowments alone","B":"Its military strength","C":"How much STI knowledge it has, how it uses it, and how fast it learns new knowledge","D":"The size of its population"},"answer":"C","explanation":"Slide 27 makes this exact point, contrasting it with mere natural endowment."},{"id":106,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Nigeria's slower economic transformation, compared to the Republic of Korea, is attributed mainly to","options":{"A":"Lack of natural resources","B":"Less success in acquiring and using STI-based knowledge and policy","C":"A smaller population","D":"Lack of international trade partners"},"answer":"B","explanation":"Slide 27 attributes Korea's faster transformation to greater success with STI policy and knowledge use, unlike Nigeria."},{"id":107,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to the presentation, STI itself should be understood as","options":{"A":"An end goal in itself","B":"A means to an end","C":"Irrelevant to development","D":"Only relevant to industrialised countries"},"answer":"B","explanation":"Slide 28: 'STI are not an end in themselves but a means to an end, so is STI policy.'"},{"id":108,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Nigeria's first Science & Technology Policy was introduced in what year?","options":{"A":"1979","B":"1986","C":"1997","D":"2003"},"answer":"B","explanation":"Slide 30 identifies the first S&T Policy as dating from 1986."},{"id":109,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"A major weakness of Nigeria's 1986 S&T Policy was","options":{"A":"It was too focused on emerging technologies like nanotechnology","B":"Inconsistent implementation over a 10-year timeframe and failure to incorporate new S&T areas","C":"It excluded agriculture and health sectors entirely","D":"It was never formally adopted by government"},"answer":"B","explanation":"Slide 30 lists these as the stated inadequacies of the 1986 policy."},{"id":110,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The first revision of Nigeria's S&T Policy took place in what year?","options":{"A":"1990","B":"1997","C":"2003","D":"2012"},"answer":"B","explanation":"Slide 30 dates the first revision to 1997."},{"id":111,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"A key weakness of the 1997 revision was that it failed to address","options":{"A":"Sectoral development in agriculture and health","B":"Institutional frameworks fostering interaction within the National System of Innovation (NSI)","C":"Coordination and management of the S&T system","D":"International cooperation"},"answer":"B","explanation":"Slide 30 states the 1997 revision 'failed to address the institutional frameworks that should foster interaction among the various elements of the NSI.'"},{"id":112,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The second revision of Nigeria's S&T Policy occurred in what year?","options":{"A":"1997","B":"2000","C":"2003","D":"2012"},"answer":"C","explanation":"Slide 31 dates the second revision to 2003."},{"id":113,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The 2003 revision focused on which of the following emerging technology areas?","options":{"A":"Only agriculture and health","B":"Biotechnology, energy and environment, ICT, nanotechnology, materials science/engineering","C":"Only defence and security","D":"Purely traditional/indigenous technologies"},"answer":"B","explanation":"Slide 31 lists these specific emerging technology focus areas for the 2003 revision."},{"id":114,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"A key criticism of the 2003 revision was that it became","options":{"A":"Too short and vague","B":"A voluminous compendium of sub-sectoral policies, inadequate for building S&T culture","C":"Focused only on foreign investment","D":"Entirely focused on funding mechanisms"},"answer":"B","explanation":"Slide 31 describes the 2003 policy as 'a compendium of key S&T sub-sectoral policies... voluminous and inadequate.'"},{"id":115,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which of the following was NOT cited as a weakness of Nigeria's national S&T system despite multiple policy revisions?","options":{"A":"Poor policy implementation due to ineffective instruments","B":"Weak integration of S&T into national socio-economic policy","C":"Excess funding leading to waste","D":"Limited stakeholder participation and ownership"},"answer":"C","explanation":"Slide 32 lists poor implementation, weak integration, lack of frameworks, poor culture promotion, limited statistics use, weak capacity, inadequate FUNDING (not excess), and limited stakeholder ownership."},{"id":116,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"A key reason for developing a NEW STI Policy was to shift focus from","options":{"A":"Knowledge utilisation to knowledge generation","B":"Knowledge generation to knowledge utilisation (promoting technology entrepreneurship)","C":"Agriculture to industry","D":"Federal to state government control"},"answer":"B","explanation":"Slide 34 explicitly states the need to shift focus 'from knowledge generation to utilisation (Promote Technology Entrepreneurship).'"},{"id":117,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In developing the new STI policy, the S&T policies of how many other countries were critically analysed?","options":{"A":"Over 10","B":"Over 15","C":"Over 25","D":"Over 40"},"answer":"C","explanation":"Slide 36: 'Critical analyses of S&T policies of over twenty-five (25) countries.'"},{"id":118,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which past project/document was analysed as part of Nigeria's own existing STI reform efforts?","options":{"A":"Vision 20:2020 alone","B":"The 2005 Nigeria/UNESCO STI reform project","C":"The 1986 S&T Policy only","D":"The National Development Plan of 1975"},"answer":"B","explanation":"Slide 36 mentions the Economic Summit Group's work and the 2005 Nigeria/UNESCO STI reform project."},{"id":119,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"How many Specific Objectives does the new STI Policy Mission articulate?","options":{"A":"5","B":"6","C":"8","D":"10"},"answer":"C","explanation":"Slide 39 lists '8 Specific Objectives' under the STI Policy Mission."},{"id":120,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which of the following challenges to the STI policy review process is mentioned in the presentation?","options":{"A":"Excessive funding from international donors","B":"Competition rather than complementary efforts among MDAs","C":"Too much stakeholder consensus","D":"Overregulation by the judiciary"},"answer":"B","explanation":"Slide 40 lists 'Competition rather than complementary efforts on the part of cognate MDAs' as a challenge."},{"id":121,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"A cited example of the lack of agreement on STI policy's centrality was","options":{"A":"Non-inclusion of S&T in the National Economic Team","B":"Refusal of the President to sign the policy","C":"Rejection of the policy by the National Assembly","D":"Removal of NACETEM's funding"},"answer":"A","explanation":"Slide 40: 'Lack of agreement in the centrality of STI policy... exemplified by the non-inclusion of S&T in the National Economic Team.'"},{"id":122,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"In resolving the review process challenges, national-level leadership was assigned to","options":{"A":"State governors","B":"The Presidency","C":"NACETEM directors only","D":"International development partners"},"answer":"B","explanation":"Slide 41: 'Leadership to be provided by the presidency at the national level while state governors are responsible at the state level.'"},{"id":123,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The approach used to resolve stakeholder challenges was described as","options":{"A":"Top-down and exclusive","B":"Bottom-up, all-inclusive and participatory","C":"Purely technocratic with no public input","D":"Managed entirely by foreign consultants"},"answer":"B","explanation":"Slide 41 states a 'Bottom-up rather than top down \u2013 all inclusive and participatory approach' was used."},{"id":124,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which body is referenced in relation to robust R&D coordination in the new STI policy highlights?","options":{"A":"NDPC","B":"NRIC","C":"NEEDS","D":"FMST alone"},"answer":"B","explanation":"Slide 42 references 'Robust coordination of R&D (NRIC)' as a highlight of the new policy."},{"id":125,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Which mechanism is referenced as providing reliable funding under the new STI policy?","options":{"A":"NRIF","B":"World Bank Trust Fund","C":"TETFund","D":"Excess Crude Account"},"answer":"A","explanation":"Slide 42 references a 'Reliable Funding Mechanism (NRIF)'."},{"id":126,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"The new STI policy promotes Technology Entrepreneurship & R&D Commercialisation mainly by initiating","options":{"A":"Tax holidays for large corporations","B":"Venture Capital support","C":"Free university tuition","D":"Import restrictions on technology"},"answer":"B","explanation":"Slide 42: 'Promote Technology Entrepreneurship & R&D Commercialisation) by initiating Venture Capital.'"},{"id":127,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"Unlike previous Nigerian STI policies, the new policy is distinguished by","options":{"A":"Being developed entirely by NACETEM without external input","B":"An inclusive, bottom-up approach to stakeholder participation and ownership","C":"Focusing solely on the oil and gas sector","D":"Removing government funding responsibilities"},"answer":"B","explanation":"Slide 44: 'The policy unlike any previous one adopted an all inclusive, bottom-up approach... aimed at mustering adequate support.'"},{"id":128,"section":"Centrality of STI Policy \u2013 Bayelsa Forum","question":"According to the concluding remarks, what is required for the new STI policy to have maximum impact?","options":{"A":"One-time launch event only","B":"Continuous strategic popularisation, sensitisation and advocacy at all levels","C":"Reliance on foreign governments to implement it","D":"Restricting stakeholder involvement to government officials"},"answer":"B","explanation":"Slide 45: FMST and stakeholders 'must continue to embark on strategic popularization, sensitization and advocacy to all levels.'"},{"id":129,"section":"STI for Development in Plateau State","question":"Who presented the paper \"Harnessing Science, Technology and Innovation for Development in Plateau State\"?","options":{"A":"Willie O. Siyanbola","B":"M.O. Ilori","C":"Da Jonah David Jang","D":"Rifkatu Durfa"},"answer":"A","explanation":""},{"id":130,"section":"STI for Development in Plateau State","question":"At which event was this paper presented?","options":{"A":"NACETEM Annual Conference","B":"Plateau State S&T Intervention Summit","C":"Vision 20:2020 Summit","D":"Nigeria/UNESCO STI Forum"},"answer":"B","explanation":""},{"id":131,"section":"STI for Development in Plateau State","question":"In what year was the paper presented?","options":{"A":"2003","B":"2007","C":"2009","D":"2012"},"answer":"C","explanation":""},{"id":132,"section":"STI for Development in Plateau State","question":"Who was the Executive Governor of Plateau State acknowledged in the paper?","options":{"A":"Mrs. Pauline Kedem Tallen","B":"Da Jonah David Jang","C":"Mrs. Doris Malo","D":"Mrs. Rifkatu Durfa"},"answer":"B","explanation":""},{"id":133,"section":"STI for Development in Plateau State","question":"Who was the Honourable Commissioner for S&T acknowledged in the paper?","options":{"A":"Mrs. Doris Malo","B":"Mrs. Pauline Kedem Tallen","C":"Mrs. Rifkatu Durfa","D":"Da Jonah David Jang"},"answer":"C","explanation":""},{"id":134,"section":"STI for Development in Plateau State","question":"In what year was Plateau State created?","options":{"A":"1967","B":"1976","C":"1986","D":"1996"},"answer":"B","explanation":""},{"id":135,"section":"STI for Development in Plateau State","question":"What is the capital of Plateau State?","options":{"A":"Barakin-Ladi","B":"Jos","C":"Pankshin","D":"Vom"},"answer":"B","explanation":""},{"id":136,"section":"STI for Development in Plateau State","question":"What was Plateau State's area ranking among Nigeria's 36 states?","options":{"A":"5th","B":"12th","C":"20th","D":"26th"},"answer":"B","explanation":""},{"id":137,"section":"STI for Development in Plateau State","question":"What was Plateau State's population ranking (2006) among the 36 states?","options":{"A":"12th","B":"17th","C":"26th","D":"30th"},"answer":"C","explanation":""},{"id":138,"section":"STI for Development in Plateau State","question":"What was Plateau State's total GDP (PPP), based on 2007 data?","options":{"A":"$1.5 billion","B":"$3.18 billion","C":"$5.15 billion","D":"$10 billion"},"answer":"C","explanation":""},{"id":139,"section":"STI for Development in Plateau State","question":"What was Plateau State's GDP per capita (PPP, 2007)?","options":{"A":"$1,587","B":"$2,028","C":"$3,180","D":"$5,150"},"answer":"A","explanation":""},{"id":140,"section":"STI for Development in Plateau State","question":"How many Local Government Areas (LGAs) does Plateau State have?","options":{"A":"15","B":"17","C":"20","D":"25"},"answer":"B","explanation":""},{"id":141,"section":"STI for Development in Plateau State","question":"How many state ministries does Plateau State have, per the data slide?","options":{"A":"12","B":"15","C":"17","D":"20"},"answer":"B","explanation":""},{"id":142,"section":"STI for Development in Plateau State","question":"How many universities did Plateau State have according to the presentation?","options":{"A":"None","B":"1","C":"2","D":"3"},"answer":"B","explanation":""},{"id":143,"section":"STI for Development in Plateau State","question":"How many research institutes are listed under Plateau State's higher education institutions?","options":{"A":"1","B":"3","C":"5","D":"7"},"answer":"C","explanation":""},{"id":144,"section":"STI for Development in Plateau State","question":"How many primary schools did Plateau State have, according to the slide?","options":{"A":"285","B":"289","C":"637","D":"750"},"answer":"C","explanation":""},{"id":145,"section":"STI for Development in Plateau State","question":"Which teaching hospital is named as a secondary health facility in Plateau State?","options":{"A":"Jos University Teaching Hospital","B":"University of Jos Teaching Hospital","C":"Plateau State General Hospital","D":"NNMDA Health Centre"},"answer":"B","explanation":""},{"id":146,"section":"STI for Development in Plateau State","question":"Which of the following is listed as a mineral resource of Plateau State?","options":{"A":"Crude oil","B":"Columbite","C":"Coal","D":"Bitumen"},"answer":"B","explanation":""},{"id elopment in Plateau State","question":"Between 1986 and 1994, the 50 leading S&T countries grew at what rate compared to the other 130 countries?","options":{"A":"Half as fast","B":"About the same","C":"About 3 times greater","D":"10 times greater"},"answer":"C","explanation":""},{"id":154,"section":"STI for Development in Plateau State","question":"Over that same period, the per capita income of the 130 less S&T-advanced countries","options":{"A":"Grew by 1.1% per year","B":"Remained unchanged","C":"Fell by 1.5% per year","D":"Doubled"},"answer":"C","explanation":""},{"id":155,"section":"STI for Development in Plateau State","question":"Which strategic area is NOT listed among the areas of S&T intervention for state development?","options":{"A":"Capacity/capability building for R&D","B":"Production & services (agriculture, manufacturing)","C":"Mining and mineral processing","D":"Military defence production"},"answer":"D","explanation":""},{"id":156,"section":"STI for Development in Plateau State","question":"According to Freeman (1987), a National Innovation System (NIS) is defined as","options":{"A":"A government ministry dedicated to science","B":"The network of institutions in public/private sectors that initiate, import, modify and diffuse new technologies","C":"A university research programme","D":"A private-sector R&D unit"},"answer":"B","explanation":""},{"id":157,"section":"STI for Development in Plateau State","question":"In the \"triple helix\" concept referenced in the presentation, what does GIA stand for?","options":{"A":"Government, Industry, Academia","B":"Growth, Innovation, Agriculture","C":"Government, Infrastructure, Agencies","D":"Global Innovation Alliance"},"answer":"A","explanation":""},{"id":158,"section":"STI for Development in Plateau State","question":"According to the presentation, what is described as a \"precondition for STI engagement to be meaningful and impactful\"?","options":{"A":"Foreign direct investment","B":"Linking all key el   const sections = [...new Set(QUESTIONS.map(q=>q.section))];

  const sectionList = document.getElementById('section-list');
  sections.forEach(function(s){
    const count = QUESTIONS.filter(q=>q.section===s).length;
    const row = document.createElement('label');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;';
    row.innerHTML = '<input type="checkbox" class="sec-check" value="'+s+'" checked style="width:16px;height:16px;"/><span style="flex:1;">'+s+'</span><span style="color:var(--text-muted);">'+count+'</span>';
    sectionList.appendChild(row);
  });

  document.getElementById('select-all').onclick = function(){
    document.querySelectorAll('.sec-check').forEach(c=>c.checked=true);
  };
  document.getElementById('select-none').onclick = function(){
    document.querySelectorAll('.sec-check').forEach(c=>c.checked=false);
  };

  const qcount = document.getElementById('qcount');
  const qcountOut = document.getElementById('qcount-out');
  qcount.oninput = function(){ qcountOut.textContent = qcount.value; };

  function shuffle(arr){
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  let quiz = [];
  let idx = 0;
  let score = 0;
  let answered = false;
  let missed = [];

  document.getElementById('start-btn').onclick = function(){
    const checked = [...document.querySelectorAll('.sec-check:checked')].map(c=>c.value);
    if (checked.length === 0){
      document.getElementById('setup-warn').style.display = 'block';
      return;
    }
    document.getElementById('setup-warn').style.display = 'none';
    const pool = QUESTIONS.filter(q => checked.includes(q.section));
    const n = Math.min(parseInt(qcount.value,10), pool.length);
    quiz = shuffle(pool).slice(0, n).map(function(q){
      const letters = ['A','B','C','D'];
      const shuffledLetters = shuffle(letters);
      const opts = shuffledLetters.map(function(L){ return {text: q.options[L], correct: L === q.answer}; });
      return {
        section: q.section,
        question: q.question,
        explanation: q.explanation,
        opts: opts
      };
    });
    idx = 0; score = 0; missed = [];
    document.getElementById('setup-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    renderQuestion();
  };

  function renderQuestion(){
    answered = false;
    const q = quiz[idx];
    document.getElementById('progress-label').textContent = 'Question ' + (idx+1) + ' of ' + quiz.length;
    document.getElementById('score-label').textContent = 'Score: ' + score + '/' + idx;
    document.getElementById('progress-bar').style.width = Math.round(((idx)/quiz.length)*100) + '%';
    document.getElementById('q-section').textContent = q.section;
    document.getElementById('q-text').textContent = q.question;
    document.getElementById('explain-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';

    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = '';
    q.opts.forEach(function(opt, i){
      const btn = document.createElement('button');
      btn.style.cssText = 'width:100%;text-align:left;padding:10px 14px;font-size:14px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-2);cursor:pointer;';
      btn.textContent = opt.text;
      btn.onclick = function(){ selectOption(i); };
      optsDiv.appendChild(btn);
    });
  }

  function selectOption(i){
    if (answered) return;
    answered = true;
    const q = quiz[idx];
    const buttons = document.querySelectorAll('#options button');
    buttons.forEach(function(b, j){
      b.style.cursor = 'default';
      if (q.opts[j].correct){
        b.style.background = 'var(--bg-success)';
        b.style.borderColor = 'var(--border-success)';
        b.style.color = 'var(--text-success)';
      } else if (j === i){
        b.style.background = 'var(--bg-danger)';
        b.style.borderColor = 'var(--border-danger)';
        b.style.color = 'var(--text-danger)';
      }
    });
    if (q.opts[i].correct){
      score++;
    } else {
      missed.push(q);
    }
    document.getElementById('score-label').textContent = 'Score: ' + score + '/' + (idx+1);
    if (q.explanation){
      const box = document.getElementById('explain-box');
      box.textContent = q.explanation;
      box.style.display = 'block';
    }
    document.getElementById('next-btn').style.display = 'block';
  }

  document.getElementById('next-btn').onclick = function(){
    idx++;
    if (idx >= quiz.length){
      showResults();
    } else {
      renderQuestion();
    }
  };

  function showResults(){
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('progress-bar').style.width = '100%';
    const pct = Math.round((score/quiz.length)*100);
    document.getElementById('final-score').textContent = score + ' / ' + quiz.length;
    document.getElementById('final-pct').textContent = pct + '% correct' + (pct >= 70 ? ' — passing range' : ' — keep drilling weak topics');
    const missedDiv = document.getElementById('missed-list');
    missedDiv.innerHTML = '';
    if (missed.length === 0){
      const p = document.createElement('p');
      p.style.cssText = 'font-size:14px;color:var(--text-secondary);text-align:center;';
      p.textContent = 'No misses. Clean sweep.';
      missedDiv.appendChild(p);
    } else {
      const label = document.createElement('p');
      label.style.cssText = 'font-size:13px;color:var(--text-secondary);margin:0 0 4px;';
      label.textContent = 'Review ' + missed.length + ' missed question' + (missed.length>1?'s':'') + ':';
      missedDiv.appendChild(label);
      missed.forEach(function(q){
        const correct = q.opts.find(function(o){return o.correct;});
        const card = document.createElement('div');
        card.style.cssText = 'background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;';
        card.innerHTML = '<p style="font-size:12px;color:var(--text-muted);margin:0 0 4px;">'+q.section+'</p>'+
          '<p style="font-size:14px;margin:0 0 4px;">'+q.question+'</p>'+
          '<p style="font-size:13px;color:var(--text-success);margin:0;">Correct: '+correct.text+'</p>';
        missedDiv.appendChild(card);
      });
    }
  }

  document.getElementById('restart-btn').onclick = function(){
    document.getElementById('result-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'block';
  };
})();
</script>
